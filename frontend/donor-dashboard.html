<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donor dashboard | FoodRescue AI</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="donor-dashboard">
  <a class="sr-only" href="#content">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
    <div class="main">
      <header class="topbar">
        <div class="row">
          <button class="btn btn-secondary btn-sm mobile-menu" id="menu-btn" type="button" aria-controls="sidebar">Menu</button>
          <h1 id="page-title">Donor dashboard</h1>
        </div>
        <div class="actions" id="topbar-actions"></div>
      </header>
      <main class="content" id="content">
        <div class="row between">
          <p class="mb-0" id="greeting">Welcome</p>
          <a class="btn btn-primary" href="create-donation.html">Post a donation</a>
        </div>
        <section class="stats" id="stats" aria-label="Summary"></section>
        <div class="grid-3">
          <section class="panel">
            <div class="panel-head"><h2>Active donations</h2><a class="small" href="donations.html">All donations</a></div>
            <div id="active"></div>
          </section>
          <section class="panel">
            <div class="panel-head"><h3>Top recommendation</h3></div>
            <div id="top-recs" class="stack"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/donor.js"></script>
</body>
</html>
